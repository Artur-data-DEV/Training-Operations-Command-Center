<div class="tocc-help-center">
  <div class="tocc-hc-card">

    <div class="tocc-hc-header">
      <div class="tocc-hc-icon"><i class="fa fa-life-ring"></i></div>
      <div>
        <h2 class="tocc-hc-title">Help Center</h2>
        <p class="tocc-hc-subtitle">Access Knowledge Base articles, open Virtual Agent, or contact the training operations team.</p>
      </div>
    </div>

    <div class="tocc-hc-actions">
      <a class="tocc-hc-btn tocc-hc-btn--primary" ng-href="{{c.data.kbUrl}}">
        <i class="fa fa-book m-r-sm"></i> Knowledge Base
      </a>
      <a class="tocc-hc-btn tocc-hc-btn--secondary" ng-href="{{c.data.vaUrl}}" target="_blank" rel="noopener">
        <i class="fa fa-comments m-r-sm"></i> Virtual Agent
      </a>
      <a class="tocc-hc-btn tocc-hc-btn--secondary" ng-href="{{c.data.supportCatalogUrl}}">
        <i class="fa fa-ticket m-r-sm"></i> Request Support
      </a>
    </div>

    <div class="tocc-hc-divider"></div>

    <div class="tocc-hc-contact">
      <div class="tocc-hc-contact-label">
        <i class="fa fa-envelope-o m-r-xs"></i> Need help from Backoffice?
      </div>
      <a class="tocc-hc-email" ng-href="mailto:{{c.data.supportEmail}}">{{c.data.supportEmail}}</a>
    </div>

  </div>
</div>
