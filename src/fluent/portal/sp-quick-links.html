<div class="tocc-portal-container">
  <div class="tocc-hero-section">
    <h1 class="tocc-hero-title">Training Operations</h1>
    <p class="tocc-hero-subtitle">Gestão centralizada de reservas, sessões de treinamento e indicadores operacionais em tempo real.</p>
  </div>

  <div class="tocc-actions-section">
    <h3 class="tocc-section-title">QUICK ACTIONS</h3>
    
    <div class="tocc-action-grid">
      <a
        ng-repeat="action in c.data.actions track by $index"
        class="tocc-action-card"
        href="{{action.href}}"
      >
        <div class="tocc-action-icon-wrapper">
          <i class="fa {{action.icon}}"></i>
        </div>
        <div class="tocc-action-content">
          <h4 class="tocc-action-title">{{action.title}}</h4>
          <p class="tocc-action-desc">{{action.desc}}</p>
        </div>
      </a>
    </div>
  </div>
</div>
