<div class="tocc-portal-container">
  <div class="tocc-hero-section">
    <div class="tocc-hero-shell">
      <div class="tocc-hero-copy">
        <div class="tocc-hero-eyebrow">Training Operations Command Center</div>
        <h1 class="tocc-hero-title">Training Operations</h1>
        <p class="tocc-hero-subtitle">Gestao centralizada de reservas, sessoes de treinamento e indicadores operacionais em tempo real.</p>
      </div>

      <div class="tocc-hero-stats" ng-if="c.data.showOpsStats">
        <div class="tocc-stat-card" ng-repeat="stat in c.data.desktopStats track by $index">
          <div class="tocc-stat-value">{{stat.value}}</div>
          <div class="tocc-stat-label">{{stat.label}}</div>
        </div>
      </div>
    </div>
  </div>

  <div class="tocc-actions-section">
    <h3 class="tocc-section-title">Quick Actions</h3>
    <div class="tocc-action-grid">
      <a
        ng-repeat="action in c.data.actions track by $index"
        class="tocc-action-card"
        href="{{action.href}}"
      >
        <div class="tocc-action-icon-wrapper">
          <i class="fa {{action.icon}}"></i>
        </div>
        <div class="tocc-action-content">
          <h4 class="tocc-action-title">{{action.title}}</h4>
          <p class="tocc-action-desc">{{action.desc}}</p>
        </div>
      </a>
    </div>
  </div>
</div>
